name: Publish CNCS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  source-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Check public HLTV access from GitHub
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          for (const path of ['/matches', '/results?team=4863&team=8840&team=11514']) {
            try {
              const response = await fetch('https://www.hltv.org' + path, {signal: AbortSignal.timeout(20000), redirect: 'error'});
              const body = await response.text();
              const challenge = /Just a moment|Verify you are human|cf-chl-/i.test(body);
              const result = JSON.stringify({path, status: response.status, challenge, bytes: body.length});
              console.log(result);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, result + '\n\n');
              if (!response.ok || challenge) process.exitCode = 1;
            } catch(error) { console.log(error.message); process.exitCode = 1; }
          }
          NODE
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public deployment bundle
        uses: actions/checkout@v6
      - name: Verify and unpack website
        run: |
          sha256sum --check site.tar.gz.sha256
          mkdir _site
          tar -xzf site.tar.gz -C _site --no-same-owner
          test -f _site/index.html
          test -f _site/data/live.json
          test -z "$(find _site -type l -print -quit)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
